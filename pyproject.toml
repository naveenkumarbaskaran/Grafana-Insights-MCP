[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grafana-insights-mcp"
version = "0.1.0"
description = "Give your LLM access to Grafana dashboards, alerts, and metrics via the Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Naveen Kumar Baskaran" }]
keywords = ["grafana", "mcp", "prometheus", "loki", "sre", "observability", "model-context-protocol"]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
grafana-mcp = "grafana_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
